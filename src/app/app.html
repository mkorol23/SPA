<h2>Практична робота №7 — RxJS switchMap</h2>

<h3>Користувачі</h3>
<ul>
  <li *ngFor="let user of users$ | async">
    <button (click)="selectUser(user.id)">
      {{ user.name }}
    </button>
  </li>
</ul>

<hr />

<h3>Пости вибраного користувача</h3>

<ul>
  <li *ngFor="let post of posts$ | async">
    <strong>{{ post.title }}</strong>
    <p>{{ post.body }}</p>
  </li>
</ul>
